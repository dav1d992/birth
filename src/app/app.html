<div class="app-shell">
  <a class="skip-link" href="#main-content">{{ i18n.t('design.skip') }}</a>
  <header class="site-header">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 24C7 19 5 13 9 9.5c3-2.5 6-.5 7 2 1-2.5 4-4.5 7-2 4 3.5 2 9.5-7 14.5Z" stroke="currentColor" stroke-width="1.5"/><path d="M16 25v-9" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      {{ i18n.t('app.name') }}
    </a>

    <nav>
      <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">{{ i18n.t('nav.timeline') }}</a>
      <a routerLink="/oxytocin" routerLinkActive="active" ariaCurrentWhenActive="page">{{ i18n.t('nav.oxytocin') }}</a>
    </nav>

    <div class="header-actions">
      <app-language-switch />
      <app-admin-lock />
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
  <footer class="site-footer">
    <span>{{ i18n.t('app.name') }}</span>
    <p>{{ i18n.t('design.footer') }}</p>
    <span class="footer-flower" aria-hidden="true">✳</span>
  </footer>
</div>
