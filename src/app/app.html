<div class="app-shell" [class.list-view]="isListPage()">
  <a class="skip-link" href="#main-content">{{ i18n.t('design.skip') }}</a>
  @if (isListPage()) {
    <div class="list-navigation">
      <button type="button" class="btn btn-ghost" (click)="viewTimeline()">{{ i18n.t('list.viewTimeline') }}</button>
    </div>
  } @else {
  <header class="site-header">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 24C7 19 5 13 9 9.5c3-2.5 6-.5 7 2 1-2.5 4-4.5 7-2 4 3.5 2 9.5-7 14.5Z" stroke="currentColor" stroke-width="1.5"/><path d="M16 25v-9" stroke="currentColor" stroke-width="1.5"/></svg>
      </span>
      {{ i18n.t('app.name') }}
    </a>

    <nav>
      <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">{{ i18n.t('nav.timeline') }}</a>
      <a routerLink="/oxytocin" routerLinkActive="active" ariaCurrentWhenActive="page">{{ i18n.t('nav.oxytocin') }}</a>
    </nav>

    <div class="header-actions">
      <app-language-switch />
      <app-admin-lock />
    </div>
  </header>
  }

  <dialog #leaveDialog class="leave-dialog" aria-labelledby="leave-dialog-title" aria-describedby="leave-dialog-description">
    <div class="dialog-heading">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 15l6-6M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 10a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9)"/></svg>
      <h2 id="leave-dialog-title">{{ i18n.t('list.leaveTitle') }}</h2>
    </div>
    <p id="leave-dialog-description">{{ i18n.t('list.leaveWarning') }}</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" autofocus (click)="closeLeaveDialog()">{{ i18n.t('list.stay') }}</button>
      <button type="button" class="btn btn-primary" (click)="confirmViewTimeline()">{{ i18n.t('list.viewTimeline') }}</button>
    </div>
  </dialog>

  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
  <footer class="site-footer">
    <span>{{ i18n.t('app.name') }}</span>
    <p>{{ i18n.t('design.footer') }}</p>
    <span class="footer-flower" aria-hidden="true">✳</span>
  </footer>
</div>
