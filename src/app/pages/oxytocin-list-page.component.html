<section class="page">
  <h1>{{ title() }}</h1>

  @if (errorKey().length > 0) {
    <p class="error" animate.enter="enter" animate.leave="leave">{{ i18n.t(errorKey()) }}</p>
  }

  @if (!unlocked()) {
    <h2>{{ i18n.t('oxytocin.list.unlockTitle') }}</h2>
    <label>
      {{ i18n.t('oxytocin.list.password') }}
      <input
        class="masked"
        type="text"
        name="oxytocin-unlock-secret"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        [value]="password()"
        (input)="onPasswordInput($event)"
      />
    </label>
    <button type="button" (click)="unlock()">{{ i18n.t('oxytocin.list.unlock') }}</button>
  } @else {
    <div class="actions">
      <button type="button" (click)="addItem()">{{ i18n.t('oxytocin.list.add') }}</button>
      <button type="button" class="ghost" (click)="shareLink()">
        @if (linkCopied()) {
          <span animate.enter="enter">{{ i18n.t('oxytocin.list.linkCopied') }}</span>
        } @else {
          <span animate.enter="enter">{{ i18n.t('oxytocin.list.share') }}</span>
        }
      </button>
      <button
        type="button"
        class="info-btn"
        [attr.aria-label]="i18n.t('oxytocin.list.infoAria')"
        [attr.aria-expanded]="showInfo()"
        (click)="toggleInfo()"
      >
        i
      </button>
      <button type="button" class="danger" (click)="deleteList()">{{ i18n.t('oxytocin.list.deleteList') }}</button>
    </div>

    @if (showInfo()) {
      <p class="info-panel" animate.enter="enter" animate.leave="leave">
        <span class="lock" aria-hidden="true">&#128274;</span>
        {{ i18n.t('oxytocin.list.encryptedInfo') }}
      </p>
    }

    <ul>
      @for (item of items(); track item.id; let idx = $index) {
        <li [attr.data-id]="item.id" animate.enter="enter" animate.leave="leave">
          <input
            class="text"
            name="oxytocin-item-text"
            autocomplete="off"
            [value]="item.text"
            [placeholder]="i18n.t('oxytocin.list.placeholder')"
            (input)="onItemTextInput(item.id, $event)"
          />
          <button type="button" (click)="moveUp(idx)">{{ i18n.t('oxytocin.list.moveUp') }}</button>
          <button type="button" (click)="moveDown(idx)">{{ i18n.t('oxytocin.list.moveDown') }}</button>
          <button type="button" class="danger" (click)="deleteItem(item.id)">{{ i18n.t('oxytocin.list.delete') }}</button>
        </li>
      }
    </ul>
  }
</section>
