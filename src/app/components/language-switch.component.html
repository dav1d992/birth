<div class="lang-switch" role="group" aria-label="Language switch">
  <button type="button" [class.active]="i18n.lang() === 'da'" (click)="setLang('da')">
    {{ i18n.t('lang.da') }}
  </button>
  <button type="button" [class.active]="i18n.lang() === 'en'" (click)="setLang('en')">
    {{ i18n.t('lang.en') }}
  </button>
</div>
