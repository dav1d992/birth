name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-hostinger-birth
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (production)
        run: pnpm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger via FTP
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          lftp -c "
            debug 3;
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            set ftp:prefer-epsv no;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:persist-retries 1;
            open --env-password -u \"$FTP_USERNAME\" -p \"$FTP_PORT\" \"$FTP_SERVER\";
            mkdir -p -f ./public_html/05-birth/dist/birth;
            mirror -R --delete --ignore-time --verbose --parallel=2 ./dist/birth/ ./public_html/05-birth/dist/birth/;
            put -O ./public_html/05-birth/dist/birth/ ./dist/birth/index.html;
          "
